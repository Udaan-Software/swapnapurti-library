services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: swpanpurati
      POSTGRES_USER: swapnapurti
      POSTGRES_PASSWORD: swapnapurti_local
    ports:
      - "55432:5432"
    volumes:
      - swapnapurti_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swapnapurti -d swpanpurati"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  swapnapurti_postgres:
